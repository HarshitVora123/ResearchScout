version: '3.8'

services:
  # ── PostgreSQL Database ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: researchscout-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-researchscout_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-researchscout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Queue ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: researchscout-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB ──────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: researchscout-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Neo4j Graph DB ────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: researchscout-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/secret_password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  # ── Backend API ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchscout-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-researchscout}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-researchscout_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-secret_password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started

  # ── Celery Background Worker ──────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchscout-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-researchscout}:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/${POSTGRES_DB:-researchscout_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - backend

  # ── Frontend Web App ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchscout-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
