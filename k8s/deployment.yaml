apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchscout-backend
  labels:
    app: researchscout-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: researchscout-backend
  template:
    metadata:
      labels:
        app: researchscout-backend
    spec:
      containers:
      - name: backend
        image: researchscout/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: researchscout-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: researchscout-backend-service
spec:
  type: ClusterIP
  selector:
    app: researchscout-backend
  ports:
  - port: 8000
    targetPort: 8000
