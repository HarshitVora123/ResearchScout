services:
  # ── Application Services ──────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rs-backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  worker:
    image: researchscout-backend
    container_name: rs-worker
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker -l info -c 4 -Q default,extract,embed
    restart: unless-stopped

  crawler:
    image: researchscout-backend
    container_name: rs-crawler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    command: celery -A app.workers.celery_app worker -l info -c 2 -Q crawl
    restart: unless-stopped

  scheduler:
    image: researchscout-backend
    container_name: rs-scheduler
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    command: celery -A app.workers.celery_app beat -l info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: rs-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # ── Data Services ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchscout}
      POSTGRES_USER: ${POSTGRES_USER:-researchscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchscout_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-researchscout}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rs-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: rs-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: rs-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-researchscout_neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-researchscout_neo4j} 'RETURN 1'" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
